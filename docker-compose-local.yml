services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    environment:
      POSTGRES_USER: psip
      POSTGRES_PASSWORD: psip
      POSTGRES_DB: psip
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psip -d psip"]
      interval: 5s
      timeout: 5s
      retries: 30

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGUSER: psip
      PGPASSWORD: psip
      PGDATABASE: psip
      H3_RESOLUTIONS: "7,8,9"
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
    depends_on:
      postgis:
        condition: service_healthy
    command: ["tail", "-f", "/dev/null"]

volumes:
  pgdata:

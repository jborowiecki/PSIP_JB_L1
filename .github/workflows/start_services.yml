name: Start Remote Database

on:
  push:
    branches:
      - env-test
      - env-qa
      - main
  workflow_dispatch:

concurrency:
  group: database-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  start-db:
    runs-on: self-hosted

    environment:
      name: ${{ github.ref_name }}

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      ENVIRONMENT: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostGIS
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            up -d --build --wait postgis

      - name: Generate and load H3 grids
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            build python
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm python

      - name: Load BDOT10K and aggregate in EPSG 2180
        if: github.ref_name == 'env-test'
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm python python /tests/test_bdot_metrics.py
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm python python /app/bdot.py
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm python python /app/verify_bdot.py

      - name: Show running containers
        run: |
          docker ps
          docker volume ls | grep remote-db || true
